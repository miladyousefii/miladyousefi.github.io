<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #10141a;
    --bg-soft: #171d25;
    --ink: #e9ecef;
    --ink-dim: #97a2ad;
    --line: #2a323c;
    --accent: #c89b4a;
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Vazirmatn', sans-serif;
    font-weight: 400;
    line-height: 1.9;
    min-height: 100%;
    display: flex;
    justify-content: center;
    padding: 64px 20px 80px;
  }
  .page { width: 100%; max-width: 640px; }

  .hero {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding-bottom: 40px;
  }
  .rings {
    position: absolute;
    top: -60px;
    width: 360px;
    height: 360px;
    z-index: 0;
    opacity: 0.55;
  }
  .photo-wrap {
    position: relative;
    z-index: 1;
    width: 168px;
    height: 168px;
    border-radius: 50%;
    overflow: hidden;
    border: 2px solid var(--accent);
    box-shadow: 0 0 0 6px var(--bg-soft), 0 12px 30px rgba(0,0,0,0.45);
    margin-bottom: 28px;
  }
  .photo-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }

  h1 {
    font-size: clamp(28px, 5vw, 36px);
    font-weight: 700;
    margin: 0 0 8px;
    letter-spacing: 0.5px;
    position: relative; z-index: 1;
  }
  .role {
    color: var(--accent);
    font-size: 15px;
    font-weight: 500;
    margin: 0 0 4px;
    position: relative; z-index: 1;
  }
  .sub {
    color: var(--ink-dim);
    font-size: 14px;
    margin: 0;
    position: relative; z-index: 1;
  }

  .divider {
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--line) 20%, var(--line) 80%, transparent);
    margin: 8px 0 36px;
  }

  .bio p {
    font-size: 16.5px;
    color: var(--ink);
    margin: 0 0 22px;
    max-width: 62ch;
    margin-left: auto;
    margin-right: auto;
  }
  .bio strong { color: var(--accent); font-weight: 600; }
  .bio .quote {
    color: var(--ink-dim);
    font-size: 15px;
    font-style: normal;
    border-right: 2px solid var(--accent);
    padding-right: 16px;
    margin-top: 30px;
  }

  .contact {
    margin-top: 48px;
    display: flex;
    justify-content: center;
  }
  .contact a {
    color: var(--ink);
    text-decoration: none;
    font-size: 15px;
    background: var(--bg-soft);
    border: 1px solid var(--line);
    padding: 12px 22px;
    border-radius: 10px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    transition: border-color 0.2s ease, transform 0.2s ease;
  }
  .contact a:hover { border-color: var(--accent); transform: translateY(-1px); }
  .contact svg { flex-shrink: 0; }

  footer {
    text-align: center;
    color: #4b5561;
    font-size: 12.5px;
    margin-top: 60px;
  }

  @media (max-width: 420px) {
    .rings { width: 300px; height: 300px; top: -50px; }
    body { padding: 48px 16px 60px; }
  }
</style>
